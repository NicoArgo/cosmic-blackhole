<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="38%" stop-color="#000"/>
      <stop offset="46%" stop-color="#ffd27a"/>
      <stop offset="55%" stop-color="#ff7a1a" stop-opacity="0.85"/>
      <stop offset="72%" stop-color="#7a1fd6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#140024" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5e00" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ff8a1f"/>
      <stop offset="50%" stop-color="#fff1c2"/>
      <stop offset="80%" stop-color="#ff8a1f"/>
      <stop offset="100%" stop-color="#ff5e00" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="back"><rect x="0" y="0" width="256" height="128"/></clipPath>
    <clipPath id="front"><rect x="0" y="128" width="256" height="128"/></clipPath>
  </defs>
  <!-- halo -->
  <circle cx="128" cy="128" r="124" fill="url(#glow)"/>
  <!-- back half of accretion disk (behind the hole) -->
  <g clip-path="url(#back)" transform="rotate(-14 128 128)">
    <ellipse cx="128" cy="128" rx="118" ry="26" fill="none" stroke="url(#disk)" stroke-width="10" filter="url(#blur)"/>
    <ellipse cx="128" cy="128" rx="118" ry="26" fill="none" stroke="url(#disk)" stroke-width="4"/>
  </g>
  <!-- lensed ring over the top -->
  <ellipse cx="128" cy="124" rx="56" ry="54" fill="none" stroke="#ffcf73" stroke-width="5" opacity="0.9" filter="url(#blur)"/>
  <!-- event horizon -->
  <circle cx="128" cy="128" r="48" fill="#000"/>
  <circle cx="128" cy="128" r="49" fill="none" stroke="#fff3d1" stroke-width="2" opacity="0.8"/>
  <!-- front half of accretion disk -->
  <g clip-path="url(#front)" transform="rotate(-14 128 128)">
    <ellipse cx="128" cy="128" rx="118" ry="26" fill="none" stroke="url(#disk)" stroke-width="12" filter="url(#blur)"/>
    <ellipse cx="128" cy="128" rx="118" ry="26" fill="none" stroke="url(#disk)" stroke-width="5"/>
  </g>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="34" cy="40" r="1.6"/><circle cx="214" cy="30" r="1.2"/>
    <circle cx="226" cy="206" r="1.6"/><circle cx="40" cy="214" r="1.1"/>
    <circle cx="190" cy="74" r="0.9"/><circle cx="66" cy="182" r="0.9"/>
  </g>
</svg>
